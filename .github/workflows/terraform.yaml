name: 'Terraform'

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: 
      - self-hosted 
      # Aqui corre el runner sin etiquetas, si se configuran etiquetas podrá seleccionar el runner 

    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 🔧 Paso extra para permitir ejecución de scripts en PowerShell
    - name: Permitir ejecución de scripts
      run: Set-ExecutionPolicy RemoteSigned -Scope Process -Force
      shell: powershell

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::342714023475:role/GitHubActionsDeployRole
          role-session-name: GitHubActionsSession

    - name: Verify identity
      run: aws sts get-caller-identity

    - name: Terraform Init
      run: terraform init
      shell: powershell

    - name: Terraform Plan
      run: terraform plan -input=false
      shell: powershell
      # 🔒 Checkov Security Scan
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

 #   - name: Install Checkov 
  #    run: pip install checkov

   # - name: Run Checkov
    #  run: checkov -d .

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
      shell: powershell
