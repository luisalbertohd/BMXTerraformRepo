name: 'Terraform'

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: 
      - self-hosted

    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 🔧 Paso extra para permitir ejecución de scripts en PowerShell
    - name: Permitir ejecución de scripts
      run: Set-ExecutionPolicy RemoteSigned -Scope Process -Force
      shell: powershell

    - name: Terraform Init
      run: terraform init
      shell: powershell

    - name: Terraform Plan
      run: terraform plan -input=false
      shell: powershell
      # 🔒 Checkov Security Scan
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Checkov
      run: pip install checkov

    - name: Run Checkov
      run: checkov -d .

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
      shell: powershell
